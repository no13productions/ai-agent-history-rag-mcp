name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-mcp-security:
    name: native MCP security
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify native prerequisites
        run: for tool in bash jq curl grep awk; do command -v "$tool"; done

      - name: Shell syntax
        run: bash -n scripts/history-rag-mcp-native.sh scripts/history-rag-mcp-native.test.sh scripts/history-rag-mcp-native.mutation.test.sh scripts/daemon-supervision-native.test.sh scripts/start.sh

      - name: Native MCP security contract
        run: bash scripts/history-rag-mcp-native.test.sh

      - name: Native daemon supervision contract
        run: bash scripts/daemon-supervision-native.test.sh

      - name: Mutation strength
        run: bash scripts/history-rag-mcp-native.mutation.test.sh

  test:
    name: lint and test
    # arc-runner-set — the DOCKER2 ARC pool every other Velenza fleet repository
    # builds on. This repo was the last one still consuming GitHub-hosted minutes.
    #
    # The pool's runner image supplies Node, pnpm, gcloud and build-essential, but
    # NOT Python or uv — both steps below fetch their own toolchain
    # (actions/setup-python honours .python-version, astral-sh/setup-uv pins
    # 0.11.32), so nothing here depends on the image carrying them. arc-runner-set
    # has unrestricted egress, unlike meridian-copilot's Squid allowlist, so those
    # downloads and the uv cache reach upstream normally.
    #
    # This label requires the repository to hold the "Meridian Docker2" runner
    # group. Granted in no13-infra ops/github-runners/docker2/runner-groups.json
    # and applied by reconcile-runner-groups.sh on DOCKER2 — a label change that
    # lands before the grant is applied cannot obtain a runner and queues forever.
    runs-on: arc-runner-set
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version-file: .python-version

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install exact locked dependencies
        run: uv sync --frozen --all-extras

      - name: Lint
        run: uv run ruff check .

      - name: Formatting
        run: uv run ruff format --check .

      - name: Tests
        run: uv run pytest -q
